<div class="brand"><div class="brand-mark"><svg class="icon"><use href="#i-refresh"/></svg></div><div><div class="brand-name">Relay<span style="color:#3b8663">.</span></div><div class="brand-sub">WORKSPACE</div></div></div>
<button class="search-global" onclick="document.getElementById('query').focus()"><svg class="icon small"><use href="#i-search"/></svg>搜索项目和任务<kbd>⌘ K</kbd></button>
<div class="nav-head">工作空间</div>
<nav class="nav-list" aria-label="主导航">
<button class="nav-item" onclick="notify('工作台页面未包含在本次原型中')"><svg class="icon nav-icon"><use href="#i-home"/></svg><span>工作台</span></button>
<button class="nav-item active"><svg class="icon nav-icon"><use href="#i-folder"/></svg><span>项目</span><span class="nav-count" id="nav-count">1</span></button>
<button class="nav-item" onclick="notify('待处理页面未包含在本次原型中')"><svg class="icon nav-icon"><use href="#i-clock"/></svg><span>待处理</span></button>
<button class="nav-item" onclick="notify('全部任务页面未包含在本次原型中')"><svg class="icon nav-icon"><use href="#i-list"/></svg><span>全部任务</span></button>
<button class="nav-item" onclick="notify('资料页面未包含在本次原型中')"><svg class="icon nav-icon"><use href="#i-book"/></svg><span>资料</span></button>
<div class="nav-sep"></div><div class="nav-head">更多</div>
<button class="nav-item" onclick="notify('日历页面未包含在本次原型中')"><svg class="icon nav-icon"><use href="#i-calendar"/></svg><span>日历</span></button>
<button class="nav-item" onclick="notify('动态页面未包含在本次原型中')"><svg class="icon nav-icon"><use href="#i-activity"/></svg><span>动态</span></button>
<button class="nav-item" onclick="setTab('archived')"><svg class="icon nav-icon"><use href="#i-archive"/></svg><span>归档</span></button>
</nav>
<div class="sidebar-spacer"></div><div class="userbox"><div class="workspace-avatar"><svg class="icon small"><use href="#i-folder"/></svg></div><div><div class="user-title">个人工作区</div><div class="user-meta">项目已加载</div></div><span class="user-dot"></span></div>
<button class="nav-item bottom" onclick="notify('设置页面未包含在本次原型中')"><svg class="icon nav-icon small"><use href="#i-settings"/></svg><span>设置</span></button><button class="nav-item bottom" onclick="notify('连接与同步页面未包含在本次原型中')"><svg class="icon nav-icon small"><use href="#i-link"/></svg><span>连接与同步</span></button>
</aside>
<main class="main">
<div class="main-inner">
<div class="breadcrumb"><span>工作空间</span><svg class="icon tiny"><use href="#i-chevron-right"/></svg><b>项目</b></div>
<div class="page-header"><div class="page-heading"><h1>项目</h1><p>让长期目标有序推进，下一步始终清晰。</p></div><div class="header-actions"><button class="btn" onclick="notify('记录目标：此处可接入现有目标创建流程')"><svg class="icon"><use href="#i-target"/></svg>记录目标</button><button class="btn primary" onclick="openNewModal()"><svg class="icon"><use href="#i-plus"/></svg>新建项目</button></div></div>
<div class="summary-strip" id="summary-strip"><div class="summary-left"><div class="summary-symbol"><svg class="icon"><use href="#i-spark"/></svg></div><div><div class="summary-main" id="summary-main">1 个项目正在推进</div><div class="summary-desc">聚焦下一步，把计划变成可执行的行动。</div></div></div><div class="summary-right"><svg class="icon small"><use href="#i-alert"/></svg><span id="summary-warning">1 个项目尚未明确下一步</span><button class="summary-link" onclick="openFirstMissing()">去完善 <span>→</span></button></div></div>
<div class="section-toolbar"><div class="tablist" role="tablist" aria-label="项目筛选"><button class="tab active" data-tab="all" onclick="setTab('all')">全部项目 <span class="tab-num" id="allnum">1</span></button><button class="tab" data-tab="active" onclick="setTab('active')">进行中 <span class="tab-num" id="activenum">1</span></button><button class="tab" data-tab="archived" onclick="setTab('archived')">已归档 <span class="tab-num" id="archivednum">0</span></button></div><div class="tools"><label class="search-project"><svg class="icon small"><use href="#i-search"/></svg><input id="query" placeholder="搜索项目名称..." oninput="renderProjects()" aria-label="搜索项目"/></label><div class="view-toggle" aria-label="项目显示方式"><button class="toggle-btn active" id="grid-view" title="网格视图" onclick="changeView('grid')"><svg class="icon small"><use href="#i-grid"/></svg></button><button class="toggle-btn" id="list-view" title="列表视图" onclick="changeView('list')"><svg class="icon small"><use href="#i-rows"/></svg></button></div></div></div>
<div class="projects-grid" id="projects"></div>
<div class="section-note"><svg class="icon"><use href="#i-check"/></svg><span id="footer-note">已加载 1 个项目 · 点击「查看项目」可查看详情</span></div>
</div>
</main>
</div>
</div>
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="项目详情"><div class="drawer-head"><b>项目详情</b><button class="drawer-close" onclick="closeDrawer()" aria-label="关闭详情"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="drawer-content" id="drawer-content"></div></aside>
<div class="modal-overlay" id="new-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="new-title"><h2 id="new-title">创建新项目</h2><p>一个项目对应一个长期目标。创建后，可以逐步拆分任务与阶段。</p><label for="new-name">项目名称</label><input id="new-name" maxlength="80" placeholder="例如：毕业设计 · 个人工作流智能体" onkeydown="if(event.key==='Enter')createProject()"/><div class="modal-footer"><button class="btn" onclick="closeNewModal()">取消</button><button class="btn primary" onclick="createProject()">创建项目</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const initialProject={id:'p1',title:'Windows桌面验收 20261007（测试）',type:'通用',phase:'规划',next:'',task:'验收任务：中文详情与条件编辑（测试）',status:'active',updated:'',local:false};
const projects=[initialProject];let currentTab='all';let currentView='grid';let selectedId='p1';let toastTimer;
const ico=(name,cls='')=>`<svg class="icon ${cls}"><use href="#i-${name}"/></svg>`;
const safe=(s)=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function updateCounts(){const active=projects.filter(p=>p.status==='active');const archived=projects.filter(p=>p.status==='archived');document.getElementById('nav-count').textContent=active.length;document.getElementById('allnum').textContent=projects.length;document.getElementById('activenum').textContent=active.length;document.getElementById('archivednum').textContent=archived.length;document.getElementById('summary-main').textContent=`${active.length} 个项目正在推进`;const missing=active.filter(p=>!p.next);document.getElementById('summary-warning').textContent=missing.length?`${missing.length} 个项目尚未明确下一步`:'所有项目的下一步都已明确';document.querySelector('.summary-right .summary-link').style.display=missing.length?'':'none';document.querySelector('.summary-right .icon').innerHTML=missing.length?'<use href="#i-alert"/>':'<use href="#i-check"/>';document.getElementById('footer-note').textContent=`已加载 ${projects.length} 个项目 · 点击「查看项目」可查看详情`}
function renderProjects(){updateCounts();const q=document.getElementById('query').value.trim().toLowerCase();const arr=projects.filter(p=>(currentTab==='all'||p.status===currentTab) && (p.title.toLowerCase().includes(q)||p.task.toLowerCase().includes(q)));const el=document.getElementById('projects');el.classList.toggle('is-list',currentView==='list');let cards=arr.map(p=>`<article class="project-card"><div class="project-body"><div class="project-top"><div class="project-kind"><span class="kind-dot"></span>${p.status==='active'?'活跃项目':'归档项目'}</div><button class="project-control" title="查看项目操作" aria-label="查看项目操作" onclick="showDrawer('${p.id}')">${ico('dots')}</button></div><div class="project-ident"><div class="project-emblem">${ico('folder')}</div><div style="min-width:0;flex:1"><h2 class="project-name">${safe(p.title)}</h2><div class="project-caption">${safe(p.type)}项目 · 正在组织你的工作</div></div><div class="status-pill"><span class="dot"></span>${p.status==='active'?'进行中':'已归档'}</div></div><div class="metadata"><div class="meta-box"><div class="meta-label">当前阶段</div><div class="meta-value">${safe(p.phase)}</div></div><div class="meta-box"><div class="meta-label">下一步</div><div class="meta-value ${!p.next?'unset':''}">${p.next?safe(p.next):'尚未明确'} <button class="setlink" onclick="event.stopPropagation();showDrawer('${p.id}',true)">${p.next?'修改 →':'设置 →'}</button></div></div></div><div class="task-line">${ico('doc','tiny')}<span>关联任务</span><span class="task-name">${safe(p.task||'暂无关联任务')}</span></div></div><div class="project-footer"><div class="footer-left">${ico('clock')}<span>${p.local?'刚刚创建':'已加载到工作区'}</span></div><button class="open-link" onclick="showDrawer('${p.id}')">查看项目 ${ico('arrow-right')}</button></div></article>`).join('');
if(!q && currentTab!=='archived'){cards+=`<button class="new-project-card" onclick="openNewModal()"><div class="new-icon">${ico('plus')}</div><h3>开启一个新项目</h3><p>为下一个想法建立专属空间<br>从目标开始，逐步推进。</p><span class="btn action-light">${ico('plus')} 新建项目</span></button>`}
if(!arr.length){cards=`<div class="empty-state">${ico('folder')}<strong>${q?'没有找到匹配的项目':currentTab==='archived'?'暂无归档项目':'这里还没有项目'}</strong><span>${q?'试试其他关键词':currentTab==='archived'?'归档后的项目会显示在这里':'点击右上角「新建项目」开始'}</span></div>`}el.innerHTML=cards;}
function openFirstMissing(){const p=projects.find(p=>p.status==='active'&&!p.next);if(p)showDrawer(p.id,true)}
function setTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));renderProjects()}
function changeView(view){currentView=view;document.getElementById('grid-view').classList.toggle('active',view==='grid');document.getElementById('list-view').classList.toggle('active',view==='list');renderProjects()}
function showDrawer(id,focusNext=false){selectedId=id;const p=projects.find(x=>x.id===id);if(!p)return;document.getElementById('drawer-content').innerHTML=`<div class="drawer-status">${ico('check','tiny')}${p.status==='active'?'进行中的项目':'已归档的项目'}</div><h2>${safe(p.title)}</h2><div class="drawer-desc">在这里整理项目状态、关联任务和下一步行动。</div><div class="drawer-actions"><button class="btn primary" onclick="notify('此处接入现有项目工作区路由')">${ico('arrow-right')} 打开项目</button><button class="btn" onclick="notify('此处接入现有项目编辑流程')">编辑信息</button></div><div class="detail-divider"></div><div class="detail-heading">项目概况</div><div class="detail-row"><span>项目类型</span><strong>${safe(p.type)}</strong></div><div class="detail-row"><span>当前阶段</span><strong>${safe(p.phase)}</strong></div><div class="detail-row"><span>项目状态</span><strong>${p.status==='active'?'进行中':'已归档'}</strong></div><div class="detail-divider"></div><div class="detail-heading">下一步</div><div class="detail-task" style="margin-bottom:13px">${safe(p.next||'尚未设定具体的下一步。你可以在此补充一项接下来要做的事。')}</div><div style="display:flex;gap:9px"><input id="next-input" aria-label="下一步" style="flex:1;min-width:0;border:1px solid #dbe6da;border-radius:8px;padding:9px 10px" placeholder="例如：完成交互验收" value="${safe(p.next)}" onkeydown="if(event.key==='Enter')saveNext()"/><button class="btn action-light" onclick="saveNext()">保存</button></div><div class="detail-divider"></div><div class="detail-heading">关联任务</div><div class="detail-task">${ico('doc','tiny')}<span style="margin-left:8px">${safe(p.task||'暂无关联任务')}</span></div><div class="detail-divider"></div><button class="danger" onclick="toggleArchive()">${p.status==='active'?'归档这个项目':'恢复这个项目'}</button>`;document.getElementById('overlay').classList.add('show');document.getElementById('drawer').classList.add('show');if(focusNext)setTimeout(()=>document.getElementById('next-input')?.focus(),230)}
function closeDrawer(){document.getElementById('overlay').classList.remove('show');document.getElementById('drawer').classList.remove('show')}
function saveNext(){const p=projects.find(x=>x.id===selectedId);if(!p)return;p.next=document.getElementById('next-input').value.trim();renderProjects();showDrawer(p.id);notify(p.next?'下一步已保存（仅在当前预览中有效）':'已清空下一步')}
function toggleArchive(){const p=projects.find(x=>x.id===selectedId);if(!p)return;p.status=p.status==='active'?'archived':'active';closeDrawer();renderProjects();notify(p.status==='active'?'项目已恢复':'项目已归档（仅在当前预览中有效）')}
function openNewModal(){document.getElementById('new-modal').classList.add('show');setTimeout(()=>document.getElementById('new-name').focus(),30)}
function closeNewModal(){document.getElementById('new-modal').classList.remove('show');document.getElementById('new-name').value=''}
function createProject(){const input=document.getElementById('new-name');const name=input.value.trim();if(!name){input.focus();notify('请输入项目名称');return}projects.unshift({id:'p'+Date.now(),title:name,type:'通用',phase:'规划',next:'',task:'',status:'active',local:true});closeNewModal();currentTab='all';document.getElementById('query').value='';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='all'));renderProjects();notify('项目已创建（仅在当前预览中有效）')}
document.getElementById('new-modal').addEventListener('click',e=>{if(e.target.id==='new-modal')closeNewModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeNewModal()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('query').focus()}});renderProjects();
</script>
</body>
</html>
