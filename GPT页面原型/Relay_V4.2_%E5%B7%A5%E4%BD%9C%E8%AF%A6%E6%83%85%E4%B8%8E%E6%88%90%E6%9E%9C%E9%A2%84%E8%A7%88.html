<script>
const I=(n,c='')=>`<svg class="${c}"><use href="#i-${n}"/></svg>`;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DATA={
 desktop:{title:'桌面端交互验收',project:'Windows 桌面验收',task:'中文详情与条件编辑',phase:'running',progress:2,steps:['已分析现有界面和需求','正在检查中文详情与交互','核对检查依据和文件版本','整理验收结果'],text:'继续检查 Windows 桌面端的中文详情、条件编辑和关联工作，完成后告诉我哪些地方需要调整。',ai:'已经完成现有界面和需求分析，正在检查中文详情与交互逻辑。你可以继续补充要求，我会尽量不中断当前工作。',draft:'',history:[],mode:'普通 Agent',scope:'D:\\Projects\\Relay',choice:'safe',selectedVersion:'v3',authorized:true,review:false},
 thesis:{title:'毕业论文 · 第二章',project:'毕业论文',task:'第二章文献与章节草稿',phase:'complete',progress:4,steps:['整理章节提纲','归纳文献观点','形成第二章草稿','核对来源与定稿条件'],text:'继续昨天的论文第二章，保留已经整理好的参考文献。',ai:'第二章草稿已整理，引用来源还需要逐条确认；目前属于工作草稿，不代表已正式定稿。',draft:'',history:[],mode:'普通 Agent',scope:'D:\\Thesis',choice:'safe',selectedVersion:'草稿 v2',authorized:true,review:false},
 general:{title:'长期项目 · 每周计划',project:'个人工作计划',task:'下一周安排',phase:'idle',progress:0,steps:['整理已有事项','确认主要目标','编排优先级','输出下周清单'],text:'帮我整理下周最值得做的三件事。',ai:'可以从已确认的目标和最近的工作进展开始，不需要重新填写完整任务表单。',draft:'',history:[],mode:'普通 Agent',scope:'未选择目录',choice:'safe',selectedVersion:'—',authorized:false,review:false},
 loose:{title:'新对话',project:'未归入项目',task:'',phase:'idle',progress:0,steps:[],text:'',ai:'',draft:'',history:[],mode:'普通 Agent',scope:'未选择目录',choice:'safe',selectedVersion:'—',authorized:false,review:false}
};
const ui={current:'desktop',detail:false,detailTab:'progress',side:true,search:'',menu:false,dialog:'',menuAnchor:'',demo:false,mobileSide:false};
const current=()=>DATA[ui.current];
Object.assign(ui,{previewIndex:null,previewTab:'content',recordFilter:'all'});
const phaseText=()=>({idle:'待命',running:'正在工作',paused:'已暂停',pausePending:'暂停请求中',ask:'需要你决定',permission:'需要操作授权',complete:'成果已就绪',finished:'已正式完成',unknown:'结果待核对',error:'检查失败'})[current().phase]||'待命';
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),2500)}
function renderSidebar(){let el=document.getElementById('sidebar');el.className='sidebar'+(ui.side?'':' collapsed')+(ui.mobileSide?' mobile-open':''); const q=ui.search.toLowerCase();const sessions=[['desktop','桌面端验收工作会话','正在检查中文详情'],['thesis','论文第二章','草稿待核对'],['general','下周工作计划','可随时继续'],['loose','独立会话','可自由讨论']].filter(x=>x[1].toLowerCase().includes(q)||x[2].toLowerCase().includes(q));el.innerHTML=`<div class="side-top"><div class="side-brand"><div><strong>Relay</strong><small>Workspace</small></div><button class="minimal-btn" data-action="toggle-side" title="折叠会话列表">${I('panel','i-sm')}</button></div><button class="new-btn" data-action="new-chat">${I('plus','i-sm')} 新对话</button><label class="search">${I('search','i-sm')} <input id="sidebar-search" placeholder="搜索会话或项目" value="${esc(ui.search)}"/></label></div><div class="sidebody"><div class="section-head">长期项目</div><div class="tree-proj">${I('folder','i-sm')} Windows 桌面验收</div>${sessions.filter(x=>x[0]==='desktop').map(sessionHtml).join('')}<div class="tree-proj">${I('folder','i-sm')} 毕业论文</div>${sessions.filter(x=>x[0]==='thesis').map(sessionHtml).join('')}<div class="tree-proj">${I('folder','i-sm')} 个人工作计划</div>${sessions.filter(x=>x[0]==='general').map(sessionHtml).join('')}<div class="section-head">未归入项目</div>${sessions.filter(x=>x[0]==='loose').map(sessionHtml).join('')}${sessions.length===0?'<div style="padding:15px;color:#9cab9e;font-size:11px">没有匹配的会话</div>':''}</div><div class="side-foot"><span class="online-dot"></span>演示工作空间 · 本地数据</div>`;document.getElementById('sidebar-search').addEventListener('input',e=>{ui.search=e.target.value;const pos=e.target.selectionStart;renderSidebar();const v=document.getElementById('sidebar-search');v.focus();v.setSelectionRange(pos,pos)})}
function sessionHtml(x){return `<button class="session ${ui.current===x[0]?'selected':''}" data-action="session" data-id="${x[0]}"><span class="sicon">${I('msg','i-sm')}</span><span class="session-copy"><div class="session-title">${x[1]}</div><div class="session-sub">${x[2]}</div></span></button>`}
function renderToolbar(){const d=current();const statusTone=['unknown','error'].includes(d.phase)?'danger':['ask','permission','pausePending'].includes(d.phase)?'warning':'';document.getElementById('toolbar').innerHTML=`<div class="title-side"><div class="crumb">工作台 / ${esc(d.project)}</div><div class="context-title">${esc(d.title)}</div></div><div class="toolbar-center"><div class="selectbox"><select class="session-select" id="active-session" aria-label="切换会话"><option value="desktop" ${ui.current==='desktop'?'selected':''}>桌面端验收工作会话</option><option value="thesis" ${ui.current==='thesis'?'selected':''}>论文第二章</option><option value="general" ${ui.current==='general'?'selected':''}>每周工作计划</option><option value="loose" ${ui.current==='loose'?'selected':''}>独立会话</option></select></div><button class="minimal-btn" data-action="new-chat" title="新建会话">${I('plus','i-sm')}</button></div><div class="toolbar-right"><div class="top-status ${statusTone}"><span class="point"></span><span class="label">${esc(phaseText())}</span></div><button class="toolbar-button" data-action="toggle-detail" title="查看工作详情">${I('panel','i-sm')}<span class="optional">工作详情</span></button><button class="toolbar-button slim" data-action="menu" title="更多操作">${I('more')}</button></div>`;document.getElementById('active-session').addEventListener('change',e=>switchSession(e.target.value))}
function progressCard(d){const p= Math.round(((d.phase==='complete'||d.phase==='finished')?100:Math.max(0,d.progress-1)/(d.steps.length||4)*100));return `<div class="progress-card"><div class="p-top"><div class="p-title">${I('chart','i-sm')} ${esc(d.steps[d.progress-1]||'正在推进当前工作')}</div><div class="p-meta">${d.phase==='running'?'第 ' + d.progress + ' / ' + d.steps.length + ' 步': d.progress + ' / ' + d.steps.length + ' 步'}</div></div><div class="progressline"><span style="width:${p}%"></span></div><div class="p-footer"><span>当前没有需要你处理的事项</span><button class="ai-link" data-action="open-progress">查看详情 →</button></div></div>`}
function interventionCard(){const d=current();if(d.phase==='ask')return `<div class="intervention"><div class="question-head">${I('clock','i-sm')} 需要你决定一件事</div><p>管理员是否可以修改其他管理员的角色？这会影响权限边界。我建议默认禁止，避免意外扩大权限。</p><label class="choice"><input name="choice" type="radio" value="safe" ${d.choice==='safe'?'checked':''}><span>默认不允许 <span style="color:#a98b55">· 推荐</span><span class="choice-desc">管理员角色修改需由拥有更高授权的人操作</span></span></label><label class="choice"><input name="choice" type="radio" value="allow" ${d.choice==='allow'?'checked':''}><span>允许，但保留完整审计记录<span class="choice-desc">适合明确需要委托权限的场景</span></span></label><div class="btnrow"><button class="primary" data-action="decide">确认选择并继续</button><button class="secondary" data-action="open-detail-review">查看影响范围</button></div></div>`;

const assets=()=>ASSETS[ui.current]||[];
function inspectorBadge(){const p=current().phase;const style=['error','unknown'].includes(p)?'danger':['ask','permission','pausePending'].includes(p)?'warning':['idle','paused'].includes(p)?'subtle':'';return `<span class="status-badge ${style}">${esc(phaseText())}</span>`}
function stepStates(d){const n=d.steps.length;return d.steps.map((name,i)=>{
 let s='waiting';const ix=Math.min(Math.max(d.progress-1,0),n-1);
 if(d.phase==='finished')s='done';
 else if(d.phase==='complete')s='done';
 else if(d.phase==='idle')s='waiting';
 else if(d.phase==='running')s=i<ix?'done':i===ix?'active':'waiting';
 else if(d.phase==='error')s=i<ix?'done':i===ix?'failed':'waiting';
 else if(d.phase==='unknown'||d.phase==='pausePending')s=i<ix?'done':i===ix?'warn':'waiting';
 else if(d.phase==='paused'||d.phase==='permission'||d.phase==='ask')s=i<ix?'done':i===ix?'warn':'waiting';
 return {name,s};
})}
function inspectorAttention(p){
 if(p==='unknown')return `<div class="attention-strip danger"><b>外部结果待核对</b>原请求结果未知，不能直接重试或认为已停止。<button data-action="reconcile">核对原请求 →</button></div>`;
 if(p==='error')return `<div class="attention-strip danger"><b>检查失败 · 无有效通过证据</b>工作文件仍可预览，但不能因此认定已交付。<button data-action="detail-records">查看检查记录 →</button></div>`;
 if(p==='permission')return `<div class="attention-strip"><b>需要操作授权</b>请求涉及受保护文件。具体文件和风险在聊天中的决策卡里显示。<button data-action="close-detail-focus">前往处理 →</button></div>`;
 if(p==='ask')return `<div class="attention-strip"><b>等待你的判断</b>只阻塞依赖该决定的步骤。<button data-action="close-detail-focus">查看问题 →</button></div>`;
 if(p==='pausePending')return `<div class="attention-strip"><b>暂停请求尚未确认</b>请等待后端可靠回执，不能直接宣称已暂停。<button data-action="detail-records">查看记录 →</button></div>`;
 return '';
}

 return `<div class="inspector-overline">当前工作</div><div class="inspector-title">${esc(d.task||'自由对话')}</div><div class="inspector-sub">${esc(d.project)} · ${d.steps.length?'关联任务':'尚无关联任务'}</div><div class="status-row">${inspectorBadge()}${d.phase==='complete'?'<span class="status-badge subtle">尚未正式完成</span>':''}</div>${d.steps.length?`<div class="inspector-progress"><span style="width:${Math.round(done/d.steps.length*100)}%"></span></div><div class="progress-caption"><span>已结束步骤 ${done} / ${d.steps.length}</span><span>${d.phase==='running'?'当前步骤进行中':'按已确认状态展示'}</span></div>`:''}${inspectorAttention(d.phase)}${d.steps.length?`<div class="detail-section-h">主要步骤</div><div class="step-flow">${steps.map(({name,s},i)=>`<div class="step-line"><span class="step-symbol ${s}">${I(s==='done'?'check':s==='failed'?'alert':s==='warn'?'clock':s==='active'?'chart':'clock','i-sm')}</span><div class="step-body"><div class="step-label">${esc(name)}</div>${i===d.progress-1 && s==='active'?'<div class="step-hint">当前正在推进</div>':''}</div><div class="step-state ${s}">${({done:'已执行',active:'执行中',warn:'等待',failed:'失败',waiting:'待进行'})[s]}</div></div>`).join('')}</div>`:`<div class="d-note">普通讨论不要求建立 Task 和 Run。涉及文件操作时才需要落实执行上下文。</div>`}${d.phase==='complete'?'<div class="attention-strip">已产生候选成果，但尚无完成凭据。可以先查看版本与验证依据。<button data-action="open-results">查看候选成果 →</button></div>':''}<button class="detail-secondary" data-action="detail-records">${I('list','i-sm')} 查看执行与验证记录 ${I('chevron','i-xs')}</button>`;
}

 return arr.reverse();
}
function recordsDetail(){const d=current(),filter=ui.recordFilter,events=recordEvents().filter(x=>filter==='all'||x.cat===filter);return `<div class="inspector-overline">运行记录</div><div class="inspector-title">执行与验证依据</div><div class="inspector-sub">工具调用、来源与判断集中在这里，避免占据进展首屏。</div>${inspectorAttention(d.phase)}<div class="detail-section-h">工作记录</div><div class="records-filter">${[['all','全部'],['tool','执行'],['check','检查'],['source','来源'],['decision','决策']].map(([k,v])=>`<button class="${filter===k?'active':''}" data-action="record-filter" data-id="${k}">${v}</button>`).join('')}</div>${events.length?events.map(e=>`<div class="record-item"><span class="rec-ico ${d.phase==='unknown'&&e.title.includes('待核对')?'err':e.cat==='decision'?'warn':''}">${I(e.cat==='tool'?'chart':e.cat==='check'?'check-circle':e.cat==='source'?'link':'clock','i-sm')}</span><div class="record-text"><div class="record-title">${esc(e.title)}</div><div class="record-sub">${esc(e.desc)}</div><div class="record-meta">${esc(e.time)}</div></div></div>`).join(''):'<div class="d-note">当前筛选下暂无对应记录。</div>'}<div class="detail-section-h">运行元数据</div><div class="kv-row"><span>Run 身份</span><strong>${d.steps.length?'RUN-DEMO-01':'未创建'}</strong></div><div class="kv-row"><span>Run 状态</span><strong>${esc(phaseText())} · 演示</strong></div><div class="kv-row"><span>Token / 费用</span><strong>未知／未采集</strong></div><div class="kv-row"><span>有效检查回执</span><strong>${d.phase==='finished'?'模拟记录':'未采集'}</strong></div><div class="kv-row"><span>目录授权</span><strong>${d.authorized?'演示授权内':'没有写入授权'}</strong></div><div class="detail-section-h">来源与记忆</div><button class="detail-secondary" data-action="preview-memory">${I('book','i-sm')} 查看项目事实、来源和决定 ${I('chevron','i-xs')}</button><div class="d-note" style="margin-top:12px">展示均为原型数据；不能把已连接、已请求或 UI 状态直接当成可信执行回执。</div>`}
function renderAssetContent(f){
 if(f.kind==='code'){
   const lines=f.content.filter((line,i)=>i>1);
   return `<div class="code-view">${lines.map((line,i)=>`<div class="code-row"><span class="code-num">${i+1}</span><code>${esc(line)||' '}</code></div>`).join('')}</div>`;
 }
 return `<article class="doc-preview">${f.content.map(line=>{
  const value=esc(line);
  if(!value.trim())return '<p class="doc-muted">&nbsp;</p>';
  if(value.startsWith('# '))return `<h3>${value.slice(2)}</h3>`;
  if(value.startsWith('## '))return `<h4>${value.slice(3)}</h4>`;
  return `<p class="${value.startsWith('- ')?'doc-check':''}">${value}</p>`;
 }).join('')}</article>`;
}
function previewDetail(){const f=assets()[ui.previewIndex];if(!f){ui.previewIndex=null;return renderDetail()};const d=current(),tab=ui.previewTab;
 const status=d.phase==='finished'?'已接受 · 演示':d.phase==='complete'?'候选版本 · 待验收':'工作副本 · 未验收';
 let main='';
 if(tab==='content')main=renderAssetContent(f);
 if(tab==='diff')main=`<div class="source-panel">与演示历史基线的差异。没有连接真实 Git 或工作区，以下 diff 是固定示例。</div><div class="diff-view">${f.diff.map(([k,t])=>`<div class="diff-line ${k}">${esc(t)}</div>`).join('')}</div>`;
 if(tab==='origin')main=`<div class="detail-section-h">版本身份</div><div class="version-table"><div class="version-item"><span>当前文件版本</span><strong>${esc(f.version)}</strong></div><div class="version-item"><span>本轮业务状态</span><strong>${esc(status)}</strong></div><div class="version-item"><span>Run 来源</span><strong>${d.phase==='idle'?'无执行':'RUN-DEMO-01（模拟）'}</strong></div><div class="version-item"><span>正式完成凭据</span><strong>${d.phase==='finished'?'DEMO-CR-01（模拟）':'未生成'}</strong></div></div><div class="detail-section-h">依赖与可信性</div><div class="source-panel">关联项目：${esc(d.project)}<br/>关联工作：${esc(d.task)}<br/>工作目录：${esc(d.scope)}<br/>来源状态：原型占位，真实可读性未检查<br/>检查结论：${d.phase==='finished'?'存在演示完成记录，非真实验证':'没有本轮可靠验证结论'}</div><button class="detail-secondary" data-action="preview-record">${I('link','i-sm')} 查看关联执行与验证记录 ${I('chevron','i-xs')}</button>`;
 return `<div class="detail-top"><div class="preview-headline"><button class="preview-back" data-action="preview-back" title="返回成果列表">${I('back','i-sm')}</button><div><strong>文件预览</strong><small>只读 · 不影响当前协作</small></div></div><button class="minimal-btn" data-action="toggle-detail" title="关闭工作详情">${I('x','i-sm')}</button></div><div class="preview-bar"><div class="preview-name">${esc(f.name)}</div><div class="preview-meta">${esc(f.path)} · ${esc(status)} · ${esc(f.version)}</div><div class="preview-tabs">${[['content','预览'],['diff','变更'],['origin','版本与来源']].map(([k,v])=>`<button class="${k===tab?'active':''}" data-action="preview-tab" data-id="${k}">${v}</button>`).join('')}</div></div><div class="preview-body">${main}</div><div class="preview-footer"><span>${ui.previewIndex+1} / ${assets().length} · 示例内容</span><div style="display:flex;gap:7px"><button data-action="preview-step" data-offset="-1" ${ui.previewIndex===0?'disabled':''}>上一份</button><button data-action="preview-step" data-offset="1" ${ui.previewIndex===assets().length-1?'disabled':''}>下一份</button></div></div>`;
}
function renderDetail(){const el=document.getElementById('detail');el.className='detail'+(ui.detail?'':' closed')+(ui.detail&&ui.previewIndex!==null?' wide':'');if(!ui.detail){el.innerHTML='';return}if(ui.previewIndex!==null){el.innerHTML=previewDetail();return}
 const tab=ui.detailTab;const body=tab==='progress'?progressDetail():tab==='results'?resultsDetail():recordsDetail();
 el.innerHTML=`<div class="detail-top"><div><strong>工作详情</strong><small>按需查看，不影响协作</small></div><button class="minimal-btn" data-action="toggle-detail" title="关闭详情">${I('x','i-sm')}</button></div><div class="detail-tabs" role="tablist" aria-label="工作详情分类"><button role="tab" aria-selected="${tab==='progress'}" data-action="detail-tab" data-id="progress" class="${tab==='progress'?'active':''}">进展</button><button role="tab" aria-selected="${tab==='results'}" data-action="detail-tab" data-id="results" class="${tab==='results'?'active':''}">成果</button><button role="tab" aria-selected="${tab==='records'}" data-action="detail-tab" data-id="records" class="${tab==='records'?'active':''}">记录</button></div><div class="detail-content">${body}</div>`;
}

function render(){renderSidebar();renderToolbar();renderMessages();renderCompose();renderDetail()}
function switchSession(id){if(!DATA[id])return;ui.current=id;ui.previewIndex=null;ui.previewTab='content';ui.recordFilter='all';ui.menu=false;ui.mobileSide=false;ui.detail=false;ui.detailTab='progress';render();document.getElementById('stream').scrollTop=0}
function showDialog(name){ui.dialog=name;let title='',content='',confirm='';const d=current();if(name==='context'){title='工作目录与权限';content=`<p>普通讨论不需要目录。涉及读取或修改项目文件时，应落实目录和授权边界。</p><label class="field">工作目录（演示文本）<input id="dir-field" value="${esc(d.scope)}" placeholder="例如 D:\\Projects\\Relay"></label><label class="field">本轮文件权限<select id="auth-field"><option value="read" ${!d.authorized?'selected':''}>只读／未授权写入</option><option value="write" ${d.authorized?'selected':''}>演示授权：在指定目录内修改</option></select></label>`;confirm='保存演示设置'}
if(name==='mode'){title='选择 Agent 身份';content=`<p>身份切换不会自动扩大权限。人设助手只读，不能因切换界面获得写入权限。</p><label class="field">本轮身份<select id="agent-field"><option>普通 Agent</option><option>人设助手 · 只读</option></select></label>`;confirm='使用此身份'}
if(name==='nav'){title='其他工作区';content=`<p>项目、任务、待处理、资料、动态、设置等详细功能仍属于 Relay 产品，但不放在默认协作首屏。本 V4.1 原型聚焦协作入口。</p><div class="d-note">完整 V4.0 工程原型保留在交付包内，可作为迁移对照。</div>`;confirm='返回工作台'}
if(name==='memory'){title='来源与工作记忆';content=`<p>本轮可参考的项目事实与决定（演示）：</p><div class="d-note">已确认的项目目标 · 状态版本 v3<br/>当前事项 · ${esc(d.task||'自由讨论')}<br/>最新可读来源 · ${d.project==='毕业论文'?'文献清单 v2':'验收需求 v2'}<br/>历史记录保持可追溯，不自动覆盖。</div>`;confirm='知道了'}
if(name==='file'){title='成果文件预览';content=`<p>文件内容预览（演示，不读取真实目录）。</p><div class="d-note"># ${esc(d.task||'成果草稿')}<br/>状态：工作版本<br/>来源：演示 Run 与已确认的工作目标<br/>尚不能用此界面证明真实检查通过。</div>`;confirm='关闭'}
if(name==='review'){title='判断影响';content=`<p>本次决定的目标是确认权限边界；只修改后续任务计划，不会覆盖原项目已确认事实。</p><div class="d-note">需保留：历史验收条件与旧 Run 记录<br/>需更新：RBAC 角色变更策略<br/>需验证：新规则对应的验收条件和来源版本</div>`;confirm='返回决策'}
const h=`<div class="dialog-backdrop" id="dialog-bg"><div class="dialog" role="dialog" aria-modal="true"><h3>${title}</h3>${content}<div class="dialog-footer"><button class="secondary" data-action="close-dialog">取消</button><button class="primary" data-action="save-dialog">${confirm}</button></div></div></div>`;document.getElementById('overlay').innerHTML=h}
function closeDialog(){ui.dialog='';document.getElementById('overlay').innerHTML=''}
function saveDialog(){const d=current();if(ui.dialog==='context'){d.scope=document.getElementById('dir-field').value.trim()||'未选择目录';d.authorized=document.getElementById('auth-field').value==='write';toast('演示上下文已更新，不会读取真实文件')}else if(ui.dialog==='mode'){d.mode=document.getElementById('agent-field').value;toast('已切换展示身份（实际权限不变）')}closeDialog();render()}
function openMenu(){if(ui.menu){closeMenu();return}ui.menu=true;document.getElementById('overlay').innerHTML=`<div class="popover" id="menu"><div class="group">工作区</div><button data-action="toggle-side">${I('menu','i-sm')} 折叠／展开会话列表</button><button data-action="open-results">${I('file','i-sm')} 查看成果与版本</button><button data-action="context">${I('folder','i-sm')} 目录与权限</button><div class="group">原型场景切换</div>${[['idle','普通对话／待命'],['running','Agent 执行中'],['ask','需要用户判断'],['permission','操作超出授权'],['complete','成果已就绪'],['finished','已正式完成'],['error','检查失败'],['unknown','结果待核对']].map(([k,v])=>`<button data-action="scenario" data-id="${k}">${I(k==='ask'?'clock':k==='unknown'?'alert':'msg','i-sm')} ${v}</button>`).join('')}<div class="pop-hint">场景切换仅修改本地演示状态，不调用真实 Agent。</div></div>`}
function closeMenu(){ui.menu=false;document.getElementById('overlay').innerHTML=''}
function scenario(phase){current().phase=phase;if(phase==='running')current().progress=2;else if(['complete','finished'].includes(phase))current().progress=4;else if(phase==='idle')current().progress=0;closeMenu();render();document.getElementById('stream').scrollTop=0}
function send(){const d=current(),v=d.draft.trim();if(!v)return toast('请先输入内容');d.history.push({who:'user',text:v});d.draft='';let reply='已收到你的要求。这是离线原型，实际解释、计划调整及工具调用需要接入 Relay Agent。';if(/[?？]|为什么|怎么样|会不会/.test(v))reply='我已记录这是一个讨论或澄清问题，不会把它直接当作执行指令。真实答复需要连接模型和项目事实。';else if(/先不要|优先|改成|补充|暂停/.test(v))reply='已将这条要求视为可能影响计划的调整建议（演示）。如果涉及当前写入操作，必须先核对旧 Run 的安全边界，不能直接声称已生效。';else if(ui.current==='loose')reply='可以先自由讨论。要操作项目文件时，我会再请求目录和所需权限，不需要你预先填写完整项目表单。';d.history.push({who:'ai',text:reply});renderMessages();renderCompose();document.getElementById('stream').scrollTop=document.getElementById('stream').scrollHeight;toast('已生成演示回复 · 未调用模型')}
function next(){const d=current();if(d.phase==='running'){d.progress=Math.min(d.progress+1,4);if(d.progress===4)d.phase='complete'}else if(d.phase==='complete'){toast('候选成果不等于正式完成，请查看依据');ui.detail=true;ui.detailTab='results'}render()}
function act(a,d={}){const c=current();switch(a){
case'preview-asset':ui.previewIndex=Number(d.index);ui.previewTab='content';ui.detail=true;renderDetail();break;
case'preview-tab':ui.previewTab=d.id;renderDetail();break;
case'preview-back':ui.previewIndex=null;ui.detailTab='results';renderDetail();break;
case'preview-step':ui.previewIndex=Math.min(assets().length-1,Math.max(0,ui.previewIndex+Number(d.offset)));ui.previewTab='content';renderDetail();break;
case'preview-record':ui.previewIndex=null;ui.detailTab='records';ui.recordFilter='all';renderDetail();break;
case'record-filter':ui.recordFilter=d.id;renderDetail();break;
case'detail-records':ui.previewIndex=null;ui.detail=true;ui.detailTab='records';ui.recordFilter='all';renderDetail();break;
case'close-detail-focus':ui.detail=false;ui.previewIndex=null;renderDetail();renderToolbar();document.getElementById('stream').scrollTop=0;break;
case'back':case'home':switchSession('desktop');break;case'noop':toast('仅为桌面标题栏示意');break;case'refresh':render();toast('已刷新原型显示');break;case'toggle-side':if(window.innerWidth<=810){ui.mobileSide=!ui.mobileSide;ui.side=ui.mobileSide}else{ui.side=!ui.side;ui.mobileSide=false}closeMenu();render();break;case'new-chat':switchSession('loose');break;case'session':switchSession(d.id);break;case'toggle-detail':ui.detail=!ui.detail;if(!ui.detail)ui.previewIndex=null;renderToolbar();renderDetail();break;case'open-detail':case'open-progress':ui.detail=true;ui.previewIndex=null;ui.detailTab='progress';renderDetail();break;case'open-results':ui.detail=true;ui.previewIndex=null;ui.detailTab='results';closeMenu();renderDetail();break;case'open-detail-review':showDialog('review');break;case'detail-tab':ui.previewIndex=null;ui.detailTab=d.id;renderDetail();break;case'menu':openMenu();break;case'scenario':scenario(d.id);break;case'send':send();break;case'suggest':c.draft=d.text;renderCompose();document.getElementById('message-input').focus();break;case'context':closeMenu();showDialog('context');break;case'change-agent':showDialog('mode');break;case'preview-file':if(assets().length){ui.detail=true;ui.previewIndex=0;ui.previewTab='content';renderDetail()}else toast('当前会话尚无成果');break;case'preview-memory':showDialog('memory');break;case'copy-ai':navigator.clipboard?.writeText(c.ai||'Relay 演示消息').then(()=>toast('已复制演示消息'),()=>toast('当前浏览器未授权复制'));break;case'close-dialog':closeDialog();break;case'save-dialog':saveDialog();break;case'decide':c.choice=document.querySelector('input[name="choice"]:checked')?.value||c.choice;c.history.push({who:'ai',text:`已记录你的判断（演示）：${c.choice==='safe'?'默认不允许管理员互改角色':'允许管理员修改并记录审计'}。接下来会据此更新后续计划并保留版本记录。`});c.phase='running';render();break;case'grant':c.phase='running';toast('演示：已收到本次授权；真实操作仍需服务端核验');render();break;case'deny':c.phase='paused';c.history.push({who:'ai',text:'已拒绝本次越界操作（演示）；工作文件未修改。'});render();break;case'start':case'resume':if(c.mode.startsWith('人设')){toast('只读助手不能执行写操作');break}if(!c.authorized){showDialog('context');break}c.phase='running';c.progress=Math.max(c.progress,1);render();break;case'pause':if(c.phase!=='running'){toast('当前没有正在运行的演示 Run');break}c.phase='pausePending';render();break;case'simulate-paused':c.phase='paused';render();break;case'simulate-unknown':c.phase='unknown';render();break;case'reconcile':toast('演示：已保留原请求，等待可信状态核对；未自动重试');break;case'retry-check':c.phase='running';toast('仅模拟重新请求检查，不代表真实工具已运行');render();break;case'next':next();break;case'nav-project':case'nav-task':case'nav-todo':case'nav-knowledge':case'nav-activity':case'nav-settings':closeMenu();showDialog('nav');break;default:toast('此操作暂未包含在简化原型中')}}
document.body.addEventListener('click',e=>{if(e.target.id==='dialog-bg'){closeDialog();return}const btn=e.target.closest('[data-action]');if(btn){e.preventDefault();act(btn.dataset.action,btn.dataset)}});
document.body.addEventListener('change',e=>{if(e.target?.name==='choice')current().choice=e.target.value});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();if(ui.menu)closeMenu()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ui.side=true;renderSidebar();document.getElementById('sidebar-search')?.focus()}});
render();
</script></body></html>
