const state={view:'task',phase:'running',approvalGranted:false,chatNew:false,tab:'overview',inspector:true,inspectorMode:'progress',sidebar:true,paused:false,query:'',draft:'',mode:'普通 Agent',selectedTask:'ui',previewFile:'',messages:[],activityExpanded:false,workDir:'D:\\Projects\\relay-desktop',modal:'',customTitle:'Windows 桌面端验收',stepNames:['梳理验收范围与目标','生成验收检查清单','验证中文详情及条件编辑','整理问题与交付报告'],decisions:[],files:[{name:'桌面端验收清单.md',type:'Markdown · 8.4 KB',desc:'验收维度、检查项和通过标准'},{name:'功能测试记录.md',type:'Markdown · 5.2 KB',desc:'交互检查、中文显示与布局记录'},{name:'问题汇总.md',type:'Markdown · 2.3 KB',desc:'待修复项与优先级分类'}]};

  const preview = `<div class="inspect-section"><div class="inspect-title">${icon('file','sm')} 文件预览</div><div style="font-size:12px;font-weight:700;margin-bottom:9px">${esc(file)}</div><div class="preview-box" style="background:#fff;line-height:2"># ${esc(file.replace('.md',''))}<br/><br/>**项目**：Windows 桌面验收<br/>**目标**：检查桌面交互与中文显示<br/><br/>- 会话、任务和项目归属<br/>- 条件编辑与保存反馈<br/>- 导航和布局适应性<br/><br/>_此处为演示文档内容_</div><button class="side-action" data-action="preview-close">${icon('arrow-left','sm')} 返回任务信息</button></div>`;
  const ctxt = `<div class="inspect-section"><div class="inspect-title">${icon('folder','sm')} 当前上下文</div><div class="context-box"><label>所属项目</label><strong>Windows桌面验收 20261007（测试）</strong></div><div class="context-box"><label>工作目录</label><strong style="overflow-wrap:anywhere">${esc(state.workDir)}</strong></div><button class="side-action" data-action="open-context">${icon('edit','sm')} 修改工作目录 ${icon('chevron','sm')}</button><div class="inspect-kv"><span>执行模式</span><strong>${esc(state.mode)}</strong></div><div class="inspect-kv"><span>权限策略</span><strong>危险操作需确认</strong></div><div class="inspect-kv"><span>运行环境</span><strong>Windows / Tauri</strong></div></div>`;
  const progress = `<div class="inspect-progress"><div class="status-top">${icon(state.phase==='complete'?'circle-check':state.phase==='approval'?'warning':'activity','sm')} ${inspectorStatus}</div><div class="desc">${state.phase==='idle'?'任务尚未启动，可以先讨论并调整执行计划。':state.phase==='running'?'已完成范围分析，正在生成并复查交互验收清单。':state.phase==='approval'?'当前操作存在文件写入风险，确认之前执行流程已安全暂停。':'所有计划步骤已经执行，结果和文件可追溯。'}</div><div class="bar"><span style="width:${percentage()}%"></span></div><div class="progress-foot"><span>${state.phase==='complete'?'4 / 4':state.phase==='approval'?'2 / 4':state.phase==='idle'?'0 / 4':'1 / 4'} 个步骤</span><strong>${percentage()}%</strong></div></div><div class="inspect-section"><div class="inspect-title">${icon('grid','sm')} 任务概览</div>${getSteps().map(x=>`<div class="checkline">${icon(x.st==='finished'?'circle-check':x.st==='warn'?'warning':x.st==='progress'?'clock':'circle','sm')} <span>${esc(x.name)}</span></div>`).join('')}</div>`;
  const action = state.phase==='approval'
    ? `<button class="side-action" data-action="approval-focus" style="color:#9a672d;border-color:#ecd8b7;background:#fff9ef">${icon('shield','sm')} 前往待确认操作 ${icon('chevron','sm')}</button>`
    : state.phase==='running'
    ? `<button class="side-action" data-action="toggle-pause">${icon(state.paused?'play':'pause','sm')} ${state.paused?'继续当前任务':'暂停当前任务'} ${icon('chevron','sm')}</button>`
    : state.phase==='idle'
    ? `<button class="side-action" data-action="start-task">${icon('play','sm')} 开始执行 ${icon('chevron','sm')}</button>`
    : `<button class="side-action" data-action="export">${icon('download','sm')} 导出任务摘要 ${icon('chevron','sm')}</button>`;
  const fileSection = `<div class="inspect-section"><div class="inspect-title">${icon('file','sm')} 最近成果</div>${state.files.map(f=>`<div class="inspector-file">${icon('file','sm')} <button data-action="preview-file" data-name="${esc(f.name)}">${esc(f.name)}</button><small>${f.type.split(' · ')[1]}</small></div>`).join('')}</div>`;
  const chatSection = `<div class="inspect-section"><div class="inspect-title">${icon('link','sm')} 关联任务</div><button class="side-action" data-action="view-task">${icon('grid','sm')} 打开任务执行面板 ${icon('arrow-right','sm')}</button></div>`;
  let body = file ? preview : (state.view==='chat' ? (state.chatNew?'<div class="banner-note">独立会话未绑定任务。你可以返回任务工作台继续之前的执行过程。</div>':ctxt) + chatSection : progress + action + fileSection + ctxt);
  el.innerHTML = `<div class="inspector-head"><div><h3>${file?'成果详情':state.view==='chat'?'会话上下文':'任务详情'}</h3><div class="muted">${file?'本地预览（示例）':state.view==='chat'?'当前对话关联到同一任务':'运行状态与工作资产'}</div></div><button class="side-iconbtn" data-action="toggle-inspector" title="关闭面板">${icon('x','sm')}</button></div><div class="inspector-body">${body}</div>`;
}
function rerender(){renderSidebar();renderHeader();renderMain();renderCompose();renderInspector()}
function setPhase(ph){state.phase=ph;state.paused=false;state.approvalGranted=false;state.previewFile='';if(ph==='approval'){state.tab='overview'}else if(ph==='complete'){state.tab='files'}else{state.tab='overview'};rerender()}
function showModal(title,content,buttons=''){document.getElementById('modalMount').innerHTML=`<div class="modal-cover" id="modalCover"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>${title}</h3><button data-action="close-modal" title="关闭">${icon('x')}</button></div>${content}<div class="modal-actions"><button class="button-muted" data-action="close-modal">取消</button>${buttons}</div></div></div>`;document.getElementById('modalCover').addEventListener('mousedown',e=>{if(e.target.id==='modalCover')closeModal()})}
function closeModal(){document.getElementById('modalMount').innerHTML=''}
function promptDir(){showModal('工作目录设置','<p style="color:#86978b;font-size:11px;line-height:1.8">本原型不读取真实文件系统。修改后仅改变演示中的工作目录文本。</p><label class="field">当前目录<input id="dirField" value="'+esc(state.workDir)+'"/></label>','<button class="button-primary" data-action="save-dir">保存目录</button>')}
function showNewTask(){showModal('新建任务','<label class="field">任务名称<input id="newTaskName" value="新的工作任务" placeholder="输入任务名称"/></label><label class="field">所属项目<select><option>Windows桌面验收 20261007（测试）</option><option>独立任务</option></select></label><div class="banner-note">这是一份界面原型，新增任务只模拟导航与界面反馈。</div>','<button class="button-primary" data-action="save-new-task">创建任务</button>')}
function sendDraft(){let v=state.draft.trim();if(!v){addToast('请先输入内容');return}state.messages.push(v);state.draft='';state.view='chat';rerender();document.getElementById('bodyScroll').scrollTop=100000;addToast('演示消息已添加（未调用真实模型）')}
async function copyText(text){try{await navigator.clipboard.writeText(text);addToast('已复制到剪贴板')}catch(e){addToast('浏览器未授权剪贴板操作')}}
function handleAction(a,node){const d=node?.dataset||{};switch(a){case'back':case'home':state.view='chat';rerender();break;case'noop':addToast('窗口操作仅用于视觉演示');break;case'reset':state.messages=[];state.draft='';setPhase('running');addToast('演示状态已重置');break;case'toggle-sidebar':state.sidebar=!state.sidebar;rerender();break;case'toggle-inspector':state.inspector=!state.inspector;state.previewFile='';renderHeader();renderInspector();break;case'view-chat':state.view='chat';renderHeader();renderMain();renderInspector();break;case'view-task':state.view='task';state.chatNew=false;renderHeader();renderMain();renderInspector();break;case'set-state':state.chatNew=false;setPhase(d.state);break;case'tab':state.view='task';state.tab=d.tab;renderHeader();renderMain();renderInspector();break;case'toggle-pause':if(state.phase!=='running'){addToast('当前任务无法暂停');break}state.paused=!state.paused;renderHeader();renderMain();renderCompose();renderInspector();addToast(state.paused?'Agent 已暂停（演示）':'Agent 已继续执行（演示）');break;case'start-task':setPhase('running');addToast('Agent 开始执行（演示）');break;case'approval-focus':state.view='task';state.tab='overview';renderHeader();renderMain();renderInspector();requestAnimationFrame(()=>document.getElementById('approvalCard')?.scrollIntoView({block:'center',behavior:'smooth'}));break;case'approve':state.phase='running';state.approvalGranted=true;state.paused=false;state.tab='overview';closeModal();rerender();addToast('已批准操作，Agent 从第 4 步继续（演示）');break;case'reject':setPhase('idle');addToast('已拒绝操作；任务回到待命（演示）');break;case'preview-operation':showModal('待审批的文件变更','<div class="banner-note">下面是示例 diff，不涉及真实文件写入。</div><div class="command">文件：config/desktop-acceptance.json<br/><span style="color:#bf6360">- "checkConditions": false</span><br/><span style="color:#35875a">+ "checkConditions": true</span><br/><span style="color:#35875a">+ "language": "zh-CN"</span></div>','<button class="button-primary" data-action="approve">批准修改</button>');break;case'preview-file':state.previewFile=d.name;state.inspector=true;renderHeader();renderInspector();break;case'preview-close':state.previewFile='';renderInspector();break;case'activity-detail':showModal('工具执行记录','<div class="inspect-kv"><span>工具调用</span><strong>inspect_source</strong></div><div class="inspect-kv"><span>执行结果</span><strong>成功（演示）</strong></div><div class="command">{ "status": "success",<br/> "files_checked": 12,<br/> "source": "local-demo" }</div>');break;case'step-detail':{let i=Number(d.index)||0;showModal('计划步骤 · '+(i+1),`<div class="banner-note"><strong>${esc(state.stepNames[i])}</strong><br/>${getSteps()[i].desc}</div><p style="color:#86998d;font-size:11px;line-height:1.9">这里可查看该步骤的执行记录、重试入口与成果引用。原型中不修改实际任务数据。</p>`);break}case'edit-plan':showModal('调整执行计划',`<div style="color:#88998e;font-size:11px;line-height:1.7">修改步骤名称后，聊天和任务视图将同步显示。</div>${state.stepNames.map((x,i)=>`<label class="field">步骤 ${i+1}<input class="plan-edit-field" data-step="${i}" value="${esc(x)}"/></label>`).join('')}`,'<button class="button-primary" data-action="save-plan">保存计划</button>');break;case'save-plan':{let arr=[...document.querySelectorAll('.plan-edit-field')].map(e=>e.value.trim());if(arr.some(x=>!x)){addToast('步骤名称不能为空');break}state.stepNames=arr;closeModal();rerender();addToast('计划已更新');break}case'edit-title':showModal('编辑任务名称',`<label class="field">任务名称<input id="titleField" value="${esc(state.customTitle)}"/></label>`,'<button class="button-primary" data-action="save-title">保存修改</button>');break;case'save-title':{let v=document.getElementById('titleField').value.trim();if(!v){addToast('任务名称不能为空');break}state.customTitle=v;closeModal();rerender();addToast('任务名称已更新');break}case'choose-mode':showModal('选择 Agent 执行模式',`<label class="field">当前模式<select id="modeField"><option ${state.mode==='普通 Agent'?'selected':''}>普通 Agent</option><option ${state.mode==='规划模式'?'selected':''}>规划模式</option><option ${state.mode==='只读分析'?'selected':''}>只读分析</option></select></label><div class="banner-note">模式仅作为本原型的界面状态，不会变更实际工具权限。</div>`,'<button class="button-primary" data-action="save-mode">应用模式</button>');break;case'save-mode':state.mode=document.getElementById('modeField').value;closeModal();rerender();addToast('模式已切换为 '+state.mode);break;case'open-context':promptDir();break;case'save-dir':state.workDir=document.getElementById('dirField').value.trim()||state.workDir;closeModal();renderInspector();addToast('演示工作目录已更新');break;case'open-files':state.previewFile='';state.inspector=true;state.view='task';state.tab='files';rerender();break;case'attach':addToast('演示原型未连接本地文件选择器');break;case'send':sendDraft();break;case'new-task':showNewTask();break;case'save-new-task':{let v=document.getElementById('newTaskName').value.trim();if(!v){addToast('请填写任务名称');break}state.customTitle=v;state.selectedTask='ui';state.chatNew=false;setPhase('idle');closeModal();addToast('演示任务已创建');break}case'new-session':state.view='chat';state.chatNew=true;state.draft='';state.messages=[];state.selectedTask='';rerender();addToast('独立演示会话已打开；原任务仍保留状态');break;case'choose-chat':state.view='chat';state.chatNew=true;state.selectedTask='';rerender();break;case'choose-task':state.selectedTask=d.task;state.view='task';state.chatNew=false;rerender();if(d.task!=='ui')addToast('已切换任务导航（示例数据复用）');break;case'other-project':addToast('项目「'+d.title+'」是导航演示项');break;case'copy-response':copyText(assistantText());break;case'export':copyText('Relay Windows 桌面端验收摘要：'+states[state.phase]+'；进度 '+percentage()+'%；成果 '+state.files.map(f=>f.name).join('、'));break;case'more':showModal('任务操作','<p style="font-size:11px;color:#839487">更多操作集中到这里，避免在顶部工具栏堆叠低频按钮。</p><button class="side-action" data-action="edit-title">'+icon('edit','sm')+' 编辑任务名称</button><button class="side-action" data-action="edit-plan">'+icon('grid','sm')+' 编辑执行计划</button><button class="side-action" data-action="export">'+icon('download','sm')+' 复制任务摘要</button>');break;case'close-modal':closeModal();break;case'notifications':addToast('目前没有新的待办通知');break;default:if(a.startsWith('nav-'))addToast('「'+a.replace('nav-','')+'」为其他页面入口，本原型重点演示工作台');else addToast('交互演示');}}
document.body.addEventListener('click',event=>{let btn=event.target.closest('[data-action]');if(!btn)return;event.preventDefault();handleAction(btn.dataset.action,btn)});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!state.sidebar)state.sidebar=true;renderSidebar();document.getElementById('sideSearch')?.focus()}});
rerender();
</script>
</body>
</html>
