[package]
name = "workflow-os-rig-poc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rig-agent = { version = "0.42.0", features = ["test-utils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

