        { f: "2026-09-29/exploration/collaboration-agent-panel-task.png", t: "18:47", n: "Agent 面板 · 任务 + 近期工作", d: "三栏：任务正文、近期工作、AI 对话与输入器", tag: "探索稿" }
      ]
    },
    {
      title: "2026-10-01 · 整套 UI 重做方向候选",
      hint: "三张候选由用户选定其一作为重做基准；「工作主线」已选并已实施。",
      shots: [
        { f: "2026-10-01/work-first.png", t: "11:23", n: "工作主线", d: "以对话为主轴，第一稿；已选为整套重做基准", tag: "已选基准" },
        { f: "2026-10-01/output-first.png", t: "11:25", n: "成果书桌", d: "以正文与比较为主轴，第二稿" },
        { f: "2026-10-01/project-first.png", t: "11:25", n: "项目推进", d: "以项目下一步与工作目录为主轴，第三稿" }
      ]
    }
  ];

  const shots = [];
  const gallery = document.getElementById("gallery");
  const sortBtn = document.getElementById("sortBtn");
  document.getElementById("count").textContent = GROUPS.reduce((n, g) => n + g.shots.length, 0);

  const stamp = (shot) => (shot.day || shot.f.slice(0, 10)) + " " + shot.t;

  function buildGallery(desc) {
    shots.length = 0;
    gallery.textContent = "";

    const groups = desc ? GROUPS.slice().reverse() : GROUPS;
    for (const group of groups) {
      const section = document.createElement("section");
      const h2 = document.createElement("h2");
      h2.textContent = group.title;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = group.shots.length + " 张";
      h2.appendChild(count);
      const hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = group.hint;
      const grid = document.createElement("div");
      grid.className = "grid";

      const list = desc ? group.shots.slice().reverse() : group.shots;
      for (const shot of list) {
        const date = shot.day || shot.f.slice(0, 10);
        const index = shots.push({ ...shot, date, group: group.title.split(" · ")[0] }) - 1;
        const figure = document.createElement("figure");
        figure.innerHTML =
          '<button type="button"><img src="' + DIR + shot.f + '" alt="' + shot.n + '" loading="lazy" /></button>' +
          '<figcaption><span class="title"></span><span class="desc"></span>' +
          '<span class="shot-time">' + stamp(shot) + '</span></figcaption>';
        const title = figure.querySelector(".title");
        title.textContent = shot.n;
        if (shot.tag) {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = shot.tag;
          title.appendChild(tag);
        }
        figure.querySelector(".desc").textContent = shot.d;
        figure.querySelector("button").addEventListener("click", () => openLightbox(index));
        grid.appendChild(figure);
      }

      section.append(h2, hint, grid);
      gallery.appendChild(section);
    }
  }

  let desc = false;
  buildGallery(desc);

  sortBtn.addEventListener("click", () => {
    const showing = shots.length ? shots[current].f : null;
    desc = !desc;
    sortBtn.textContent = desc ? "排序：时间倒序 ↓" : "排序：时间正序 ↑";
    buildGallery(desc);
    if (showing && box.dataset.open) {
      current = shots.findIndex((s) => s.f === showing);
      render(current);
    }
  });

  const box = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbName = document.getElementById("lbName");
  const lbTime = document.getElementById("lbTime");
  const lbDesc = document.getElementById("lbDesc");
  const lbIndex = document.getElementById("lbIndex");
  let current = 0;

  function render(index) {
    current = (index + shots.length) % shots.length;
    const shot = shots[current];
    lbImg.src = DIR + shot.f;
    lbImg.alt = shot.n;
    lbName.textContent = shot.n;
    lbTime.textContent = stamp(shot);
    lbDesc.textContent = shot.group + " · " + shot.d;
    lbIndex.textContent = current + 1 + " / " + shots.length;
  }

  function openLightbox(index) {
    render(index);
    box.dataset.open = "true";
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    delete box.dataset.open;
    document.body.style.overflow = "";
  }

  document.getElementById("lbPrev").addEventListener("click", () => render(current - 1));
  document.getElementById("lbNext").addEventListener("click", () => render(current + 1));
  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  box.addEventListener("click", (event) => { if (event.target === box) closeLightbox(); });
  document.addEventListener("keydown", (event) => {
    if (!box.dataset.open) return;
    if (event.key === "Escape") closeLightbox();
    if (event.key === "ArrowLeft") render(current - 1);
    if (event.key === "ArrowRight") render(current + 1);
  });

  const clock = document.getElementById("clock");
  const tick = () => {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    clock.textContent = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) +
      " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  };
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
